name: feature_pekerjaan
description: "Feature Pekerjaan (Job) package"
version: 0.0.1
publish_to: none
homepage:

environment:
  sdk: ^3.10.4
  flutter: ">=1.17.0"
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_bloc: ^9.1.1
  freezed_annotation: ^3.1.0
  formz: ^0.8.0
  
  # Dependency Injection
  injectable: ^2.4.4
  get_it: ^8.0.3
  
  # Functional Programming
  fpdart: ^1.1.0
  
  # Data
  equatable: ^2.0.5
  json_annotation: ^4.8.1
  
  # UI
  flutter_svg: ^2.0.17
  
  # Navigation
  go_router: ^17.0.1
  
  # HTTP
  dio: ^5.4.0
  
  # Image & Permissions
  image_picker: ^1.0.7
  permission_handler: ^12.0.1
  
  # Location
  geolocator: ^14.0.2
  
  # Utils
  cached_network_image: ^3.4.1
  intl: ^0.19.0
  
  # Internal Packages
  core:
    path: ../../core
  domain:
    path: ../../domain
  data:
    path: ../../data
  local:
    path: ../../local
  components:
    path: ../../components
  designsystems:
    path: ../../designsystems
  network:
    path: ../../network
  shared_widgets:
    path: ../../shared_widgets
  feature_report:
    path: ../feature_report

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.10.4
  freezed: ^3.2.3
  json_serializable: ^6.7.1
