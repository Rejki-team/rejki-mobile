version: 0.0.1
publish_to: none

environment:
  sdk: ^3.10.4
  flutter: ">=1.17.0"
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.17
  lottie: ^3.3.2
  intl: ^0.19.0
  formz: ^0.8.0
  get_it: ^8.0.3
  # Internal packages
  designsystems:
    path: ../designsystems
  local:
    path: ../local
  flutter_rating_bar: ^4.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
